[package]
name = "amdl"
version = "0.1.0"
edition = "2021"
description = "A music-library harness: validate, transcode to Opus, tag, and keep a library consistent. Wraps gamdl + ffmpeg."

[[bin]]
name = "amdl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
anyhow = "1"
ctrlc = "3"
rookie = "0.5"
indicatif = "0.17"
rayon = "1"
num_cpus = "1"

[profile.release]
opt-level = 3
lto = true
