[package]
name = "amdl"
description = "Audio Metadata & Lyrics Maintainer: unify a mixed-format music library to Opus and keep its tags, cover art, and synced lyrics complete and consistent. Optional acquisition via gamdl + ffmpeg."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "amdl"
path = "src/main.rs"

[dependencies]
amdl-core = { path = "../amdl-core" }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"
anyhow = "1"
ctrlc = "3"
libc = "0.2"
num_cpus = "1"
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
