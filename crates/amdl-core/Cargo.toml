[package]
name = "amdl-core"
description = "Core library for amdl: convert, tag, cover, validate, and library-maintenance building blocks — composable by scripts and agents."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
rayon = "1"
indicatif = "0.17"
rookie = "0.5"
lofty = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = "2"
blake3 = "1"
libc = "0.2"
