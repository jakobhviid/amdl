name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Stamp version (so `amdl --version` matches the release)
        run: |
          base=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([0-9]+\.[0-9]+).*/\1/')
          v="${base}.$(git rev-list --count HEAD)"
          tmp=$(mktemp)
          sed -E "s/^version = \"[^\"]*\"/version = \"$v\"/" Cargo.toml > "$tmp" && mv "$tmp" Cargo.toml
          echo "stamped $v"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          mkdir -p dist
          tar czf "dist/amdl-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" amdl
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([0-9]+\.[0-9]+).*/\1/')
          VERSION="${base}.$(git rev-list --count HEAD)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Repackage the prebuilt x86_64 Linux binary as a Homebrew bottle so
          # `brew install` POURS it (no build-from-source, no C compiler gate).
          # A poured bottle skips the formula's `install`, so the keg must already
          # hold what install produces: binary + man page + completions.
          keg="amdl/${VERSION}"
          bin="bottlestage/${keg}/bin"
          man="bottlestage/${keg}/share/man/man1"
          zc="bottlestage/${keg}/share/zsh/site-functions"
          bc="bottlestage/${keg}/share/bash-completion/completions"
          fc="bottlestage/${keg}/share/fish/vendor_completions.d"
          rm -rf bottlestage && mkdir -p "$bin" "$man" "$zc" "$bc" "$fc"
          tar xzf art/amdl-x86_64-unknown-linux-musl.tar.gz -C "$bin"
          "$bin/amdl" man > "$man/amdl.1"
          "$bin/amdl" completions zsh  > "$zc/_amdl"
          "$bin/amdl" completions bash > "$bc/amdl"
          "$bin/amdl" completions fish > "$fc/amdl.fish"
          ( cd bottlestage && tar czf "../art/amdl-${VERSION}.x86_64_linux.bottle.tar.gz" amdl )
          echo "BOTTLE_SHA=$(sha256sum "art/amdl-${VERSION}.x86_64_linux.bottle.tar.gz" | awk '{print $1}')" >> "$GITHUB_ENV"
          gh release create "v$VERSION" art/*.tar.gz \
            --title "v$VERSION" --notes "Automated build from ${GITHUB_SHA:0:7}" \
            || gh release upload "v$VERSION" art/*.tar.gz --clobber
      - name: Prune old releases (keep the latest 10)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName'); do
            gh release delete "$t" --cleanup-tag -y || true
          done
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::warning::TAP_DEPLOY_KEY not set — built & released, but skipping the tap update."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          sha() { sha256sum "art/amdl-$1.tar.gz" | awk '{print $1}'; }
          sed -e "s/@VERSION@/${VERSION}/g" \
            -e "s/@BOTTLE_SHA@/${BOTTLE_SHA}/g" \
            -e "s/@X86_SHA@/$(sha x86_64-unknown-linux-musl)/g" \
            -e "s/@ARM_SHA@/$(sha aarch64-unknown-linux-musl)/g" \
            -e "s/@MAC_X86_SHA@/$(sha x86_64-apple-darwin)/g" \
            -e "s/@MAC_ARM_SHA@/$(sha aarch64-apple-darwin)/g" \
            ci/amdl.rb.tmpl > /tmp/amdl.rb
          git clone git@github.com:jakobhviid/homebrew-tap tap
          mkdir -p tap/Formula
          cp /tmp/amdl.rb tap/Formula/amdl.rb
          cd tap
          git config user.name "tap-bot"
          git config user.email "tap-bot@users.noreply.github.com"
          git add Formula/amdl.rb
          git commit -m "amdl ${VERSION}" || { echo "no formula change"; exit 0; }
          git push
